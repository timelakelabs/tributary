# Tributary as a Kubernetes DaemonSet (#8, phase 3).
#
# One pod per node, tailing every container log on that node
# (/var/log/containers/*.log) as a glob source (#64), each line stamped with
# the pod / namespace / container parsed from its path (#63) and the node name
# from the Downward API. State (checkpoints + queue) lives on a hostPath so a
# restarted agent resumes exactly where it stopped rather than re-shipping.
#
# No RBAC beyond a ServiceAccount: tailing host files needs no apiserver access.
# Reading pod LABELS (phase 4, #66) is what will add a read-only pods Role.
#
# Apply:   kubectl apply -f deploy/k8s/daemonset.yaml
# Dry-run: kubectl apply --dry-run=client -f deploy/k8s/daemonset.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: tributary
  labels:
    app.kubernetes.io/name: tributary
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tributary
  namespace: tributary
  labels:
    app.kubernetes.io/name: tributary
---
# The ONLY RBAC this needs, and only because of pod-label enrichment (#66):
# read-only access to pods so labels can be resolved. get/list/watch and
# nothing else — no writes, no other resources, no secrets. Drop the `labels`
# allowlist from the ConfigMap and this can go too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tributary-pod-reader
  labels:
    app.kubernetes.io/name: tributary
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tributary-pod-reader
  labels:
    app.kubernetes.io/name: tributary
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tributary-pod-reader
subjects:
  - kind: ServiceAccount
    name: tributary
    namespace: tributary
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tributary-config
  namespace: tributary
  labels:
    app.kubernetes.io/name: tributary
data:
  tributary.toml: |
    [output]
    # The TimeLakeDB write endpoint. Point this at your service.
    url = "http://timelakedb.timelakedb.svc:1963"
    database = "logs"
    gzip = true
    # SEC-4 data-plane token, if the server requires one. Mounted from the
    # `tributary-token` secret into this env var (optional: the agent runs
    # without it when the server's data auth is off).
    # token_file = "/var/run/secrets/tributary/token"

    [[source]]
    name = "k8s"
    # The glob is what makes this a DaemonSet source: one supervisor tails
    # every container log on the node, discovering and retiring them as pods
    # come and go (#64).
    path = "/var/log/containers/*.log"
    table = "kube_logs"
    # containerd/CRI-O write the CRI TEXT format
    # `<RFC3339Nano> <stdout|stderr> <F|P> <message>` (#71). The `cri` parser
    # pulls the timestamp and stream out and reassembles >16 KB `P`/`F` splits,
    # so records carry the log's OWN time, not ingestion time. Nodes still on the
    # Docker json-file driver set parser = "docker_json" instead — the config is
    # otherwise identical (both emit the same {log, stream, time} envelope).
    parser = "cri"
    timestamp = { field = "time", format = "rfc3339", resolution = "ns" }
    tags = ["stream"]

    [source.fields]
    log = "string"

    # Stamp the node name from the Downward API (see env: NODE_NAME below).
    [source.tags_static]
    node = "${NODE_NAME}"

    # Presence enables CRI path enrichment (#63): pod / namespace / container
    # are parsed from each file's path. Bounded by the node's pod count, so
    # they are safe as tags; the container id is deliberately NOT one.
    #
    # `labels` is the pod-LABEL allowlist (#66): only these labels become tags,
    # resolved once per pod from the API server and cached. Everything else is
    # dropped — a label like `pod-template-hash` is unbounded and would blow up
    # cardinality, which is why enrichment is allowlist-first. Change this list
    # to the labels you actually query by. An empty/absent list contacts no API.
    [source.kubernetes]
    labels = ["app", "version"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tributary
  namespace: tributary
  labels:
    app.kubernetes.io/name: tributary
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tributary
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tributary
    spec:
      serviceAccountName: tributary
      # A log shipper should not be the first thing evicted under pressure.
      priorityClassName: system-node-critical
      # Run on every node, control-plane included — those logs matter too.
      tolerations:
        - operator: Exists
      containers:
        - name: tributary
          image: ghcr.io/timelakelabs/tributary:latest
          args:
            - "--config"
            - "/etc/tributary/tributary.toml"
            - "--state-dir"
            - "/var/lib/tributary"
          env:
            # Downward API: the node this pod landed on, stamped as the `node`
            # tag via ${NODE_NAME} in the config above.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Optional data-plane token (SEC-4). optional: true so the agent
            # starts on clusters where the server's data auth is off.
            - name: TRIBUTARY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tributary-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            # Container logs under /var/log/pods are root-owned, so the agent
            # reads as root — but nothing else: no privilege escalation, no
            # capabilities, and its own root filesystem is read-only (all writes
            # go to the state hostPath).
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tributary
              readOnly: true
            # The glob matches the symlinks in /var/log/containers; they point
            # at the real bytes in /var/log/pods. Mount BOTH — mounting all of
            # /var/log instead would nest the agent's own log volume (below)
            # under a read-only mount, which containerd cannot create a mount
            # point inside. Read-only: the shipper never writes to what it tails.
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # Checkpoints and the durable queue. On the host, so a pod restart
            # resumes exactly instead of re-shipping or losing the queue.
            - name: state
              mountPath: /var/lib/tributary
            # The agent image declares VOLUME /var/log/tributary (its optional
            # log-file sink). With readOnlyRootFilesystem the runtime can't back
            # that with the read-only rootfs, so give it a writable emptyDir —
            # without it the container CrashLoopBackOffs on containerd before it
            # reads a single log. The agent writes here only if a [log] sink is
            # configured; it just has to exist. (This path is NOT under the two
            # read-only mounts above, which is why the mount point can be made.)
            - name: agent-log
              mountPath: /var/log/tributary
      volumes:
        - name: config
          configMap:
            name: tributary-config
        - name: agent-log
          emptyDir: {}
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/tributary
            type: DirectoryOrCreate
