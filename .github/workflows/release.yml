# Release: build the Linux packages for a tag and attach them to the Release.
#
# Triggered by a version tag, never by a push to a branch. `ci.yml` proves the
# tree; this workflow's job is only to turn a proven tree into artifacts
# somebody can install, so it deliberately does NOT re-run the test suite —
# duplicating it per tag would make cutting a release something people avoid
# doing. Instead the first job ASKS whether the tagged commit's `ci.yml` run
# finished green, and nothing else here runs until it has. This header used
# to say the tag was "expected" to point at a green commit; TimeLakeDB's
# 0.4.0 was published six minutes before its own ci run finished
# (timelakedb#168), and this file had the same header and the same hole.
#
# What it produces, attached to the GitHub Release:
#   tributary_<version>_amd64.deb      apt / dpkg
#   tributary-<version>.x86_64.rpm     dnf / yum / rpm
#   SHA256SUMS
#
# The build itself is `packaging/build.sh`, which runs entirely in containers.
# The runner therefore needs Docker and nothing else — no Rust toolchain, no
# nfpm, no rpmbuild — and a laptop reproduces the artifact with the same
# command. It also means the glibc floor is a property of the build image
# (Debian 11, glibc 2.31), not of whatever the hosted runner happens to ship
# this month; see the comment at the top of build.sh for why that matters.

name: release

on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be re-run, or a package be built off a branch for
  # inspection, without cutting a tag to find out.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0-alpha). Defaults to the latest tag.'
        required: false
        type: string

# A release must never be cancelled by a later push. Grouped per ref so two
# tags can build at once, but neither interrupts the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Did `ci.yml` finish green on this commit? Not "was it expected to".
  # TimeLakeDB's 0.4.0 release run started ten seconds after the ci run for
  # the same commit and finished first, on a commit whose parent's run had
  # been cancelled mid-flight and never got a verdict. Nothing checked, so
  # nothing noticed. Same file here, same hole.
  #
  # No Rust build: one API call and a git walk, so it answers in seconds. A
  # refused tag does not need to move — re-run this workflow from the
  # Actions page once ci is green; the event is kept, so a re-run still
  # publishes. The script explains the docs-only case (ci.yml skips a
  # markdown-only push on purpose, so the verdict is the parent's).
  gate:
    name: gate · ci was green
    runs-on: ubuntu-latest
    # A workflow_dispatch builds a package off a branch for inspection and
    # publishes nothing, so there the gate reports and does not block. On a
    # tag it blocks.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate walks first-parents for a docs-only tag, so it needs
          # more than the default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The tagged commit's ci run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/test_release_gate.py
          python .github/scripts/release_gate.py

  packages:
    name: build · deb + rpm
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh derives the version from `git describe`, which needs the
          # tags — a shallow clone has none of them.
          fetch-depth: 0

      - name: Build packages
        run: |
          chmod +x packaging/build.sh
          packaging/build.sh ${{ inputs.version }}

      # Installing the artifact is the only check that matters here, and it is
      # cheap: four containers, no compilation. A package that builds but will
      # not install is exactly the failure a release pipeline exists to catch
      # before a user does, and the two formats fail differently.
      - name: Verify the packages install and run
        run: |
          chmod +x packaging/verify.sh
          packaging/verify.sh

      - name: Attach to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          # A tag ending in a pre-release identifier is marked as such, so
          # `v0.1.0-alpha` does not present itself as the stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Kept for a workflow_dispatch run, where there is no Release to attach
      # to and the artifacts would otherwise be discarded with the runner.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tributary-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          retention-days: 14

  # The image a DaemonSet actually pins (#77). `ci.yml` publishes `:main` and
  # `:<sha>` for Catchment's conformance job to consume; neither is a
  # release, and `:latest` — which ci.yml used to push too — meant "whatever
  # main last built", so a node that rebooted pulled a different agent than
  # its neighbours. `:latest` now means the latest release and is written
  # here only.
  #
  # arm64 is built HERE and not in `ci.yml`, for the reason TimeLakeDB's
  # release gives: under QEMU a Rust release build is roughly three times the
  # pipeline, and paying that once per tag is reasonable where paying it on
  # every push is how a build gate gets deleted.
  image:
    name: publish · multi-arch image
    runs-on: ubuntu-latest
    needs: [gate]
    # Job-level permissions REPLACE the workflow's, they do not merge with
    # them, so `contents: read` has to be spelled out next to `packages`.
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # v0.5.0 -> 0.5.0. The image tag carries no `v`, matching the packages
      # and the manifest, so one version string names all three artifacts.
      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          raw='${{ inputs.version }}'
          if [ -z "$raw" ]; then raw='${{ github.ref_name }}'; fi
          version=${raw#v}
          if [ -z "$version" ]; then
            echo "no version: not a tag and no workflow_dispatch input" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          img=ghcr.io/${{ github.repository_owner }}/tributary
          tags="$img:$version"
          case "$version" in
            *-*) : ;;                      # a pre-release never takes `latest`
            *)   tags="$tags,$img:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "building $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          # Attestations off: buildx otherwise adds `unknown/unknown` entries
          # to the manifest list, and `kind load` chokes on them besides.
          provenance: false
          tags: ${{ steps.v.outputs.tags }}
          cache-from: type=gha,scope=tributary

      # The manifest list is the deliverable, so it is checked rather than
      # assumed: a single-arch push succeeds and tags exactly the same way.
      - name: The image really is multi-arch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref=ghcr.io/${{ github.repository_owner }}/tributary:${{ steps.v.outputs.version }}
          docker buildx imagetools inspect "$ref" | tee /tmp/manifest.txt
          for want in linux/amd64 linux/arm64; do
            grep -q "$want" /tmp/manifest.txt \
              || { echo "$ref is missing $want" >&2; exit 1; }
          done
          { echo '### image'; echo '```'; cat /tmp/manifest.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      # ...and somebody who is NOT us can fetch it. The step above runs as
      # the pushing identity, so it proves the image is multi-arch and says
      # nothing about whether it is reachable — a package stays private
      # until someone makes it public, and a repository going public does
      # not take its packages with it. Neither product's did: both repos
      # were public for weeks while an anonymous pull of `:0.4.0` answered
      # 403, which is an ImagePullBackOff for every operator applying the
      # DaemonSet manifest this workflow attaches (timelakedb#187).
      #
      # Anonymous means anonymous: a fresh registry token with no
      # credentials, rather than `docker logout`, which would wreck the
      # daemon's auth for anything later in the job. No `-f` and a sed
      # parse that cannot throw, because for a private package the token
      # endpoint itself answers 401 with a non-JSON body and a strict fetch
      # would die before reaching the message that says what to do.
      - name: Anyone can pull it
        if: github.event_name == 'push' && !github.event.repository.private
        run: |
          set -euo pipefail
          repo=${{ github.repository_owner }}/tributary
          ver=${{ steps.v.outputs.version }}
          tok=$(curl -s "https://ghcr.io/token?scope=repository:$repo:pull&service=ghcr.io" \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" \
                   -H 'Accept: application/vnd.oci.image.index.v1+json' \
                   -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                   "https://ghcr.io/v2/$repo/manifests/$ver")
          echo "anonymous GET manifests/$ver -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::$repo:$ver was published but is not publicly pullable \
          (HTTP $code). This repository is public, so its package should be too: \
          Packages -> tributary -> Package settings -> Change visibility -> Public. \
          Granting individual repositories read access instead fixes CI and leaves \
          every operator applying the DaemonSet in ImagePullBackOff (timelakedb#187)."
            exit 1
          fi

  # The DaemonSet manifest, stamped at the tag and attached to the Release.
  # The file in the tree pins the crate version of the tree it is in (a
  # cargo test holds the two equal), which is the released version only at
  # a release commit; the ARTIFACT is what an operator applies, and it is
  # written only after the image it names exists, so it can never point at
  # a tag nobody pushed.
  manifest:
    name: publish · daemonset manifest
    runs-on: ubuntu-latest
    needs: [image, packages]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp the manifest at the tag, and validate it
        run: |
          set -euo pipefail
          v='${{ needs.image.outputs.version }}'
          mkdir -p dist
          sed "s#image: ghcr.io/timelakelabs/tributary:.*#image: ghcr.io/timelakelabs/tributary:$v#" \
            deploy/k8s/daemonset.yaml > dist/daemonset.yaml
          grep -n 'image: ' dist/daemonset.yaml >> "$GITHUB_STEP_SUMMARY"
          # validate.py compares the tag with Cargo.toml, which at a release
          # commit is the same number; a mismatch here means the tag was cut
          # on a commit that is not a release commit.
          pip install -q pyyaml
          python deploy/k8s/validate.py dist/daemonset.yaml
      - name: Attach the manifest to the Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/daemonset.yaml
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tributary-daemonset
          path: dist/daemonset.yaml
          retention-days: 14
