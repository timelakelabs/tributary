name: ci

# Tributary ships data into TimeLakeDB, so the gates are the same ones that
# repo enforces: formatting, clippy with warnings denied, and the whole test
# suite. Nothing here needs a service — the shipper's tests drive the tail,
# queue, watermark and auth logic directly, and the end-to-end proof against
# a live node is the drills in `bench/`. Those are a CI job now, just not
# this one: `nightly.yml` runs them on a schedule (#79), because they are
# minutes of wall-clock each and belong nowhere near a pull request gate.
# Markdown does not gate this workflow: the Rust jobs plus a conformance run
# that pulls the fixture image are minutes-expensive, and no test here reads a
# .md file. A docs-only commit on main therefore gets no run of its own — the
# last green run still describes the last commit that could change behaviour,
# and release.yml's gate reads it the same way.
#
# A PULL REQUEST is different, and used to be filtered the same way. `main`
# now requires these checks to pass (timelakedb#169), and a required check
# that never reports is a pull request that never merges: GitHub leaves a
# path-filtered workflow's checks "expected" forever. Two docs-only pull
# requests merged here in the four weeks before this with no run at all, and
# both would have been stuck. So a pull request always gets a run, a cheap
# `changes` job says whether anything below cares, and the expensive jobs
# condition on it. A job skipped by an `if` reports success; a docs-only
# pull request is a green run in which nothing ran, and it merges.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:

# A newer push replaces an in-progress run for a pull request, where only
# the newest head can merge. Not on main: a commit there gets its run to
# the end, because a cancelled run is a commit with no verdict, and
# release.yml's gate (timelakedb#168) has nothing to read for it. That is
# how TimeLakeDB's CI restructure went out under 0.4.0 untested. The cost
# is one queued build per push that lands during a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Did this change touch anything the jobs below run for? Seconds, no Rust.
  # On a push to main the answer is always yes, because `paths-ignore`
  # already filtered the event; on a pull request it is a diff against the
  # base, judged by the same list release.yml's gate uses (one copy, checked
  # against `paths-ignore` above by a test).
  #
  # This job is itself a required check, on purpose. A job whose dependency
  # FAILED is skipped and reports success, so if this one broke and were not
  # required, every job below would skip, every check would read green, and
  # an untested pull request would merge. Required, a broken gate blocks.
  changes:
    name: changes · anything ci runs for
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: c
        run: |
          python .github/scripts/test_pr_touches_code.py
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            python .github/scripts/pr_touches_code.py \
              --base '${{ github.event.pull_request.base.sha }}' --head HEAD
          else
            echo "code=true: a push to main is already path-filtered"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The one gate that catches a class of bug the test suite structurally
  # cannot: a persisted format that an OLDER agent will read wrongly. Every
  # test writes and reads with one binary, so "a rollback mis-reads this" is
  # invisible by construction; it is a review question, and this makes the
  # pull request answer it (timelakedb#173). A copy of TimeLakeDB's gate,
  # watching this repo's checkpoint and spool (.github/persisted-formats.txt).
  # No Rust build, so it answers in seconds.
  compat:
    name: compat · persisted formats
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs this branch against the base commit, so it needs
          # more than the default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compatibility declaration
        env:
          # Through the environment, never interpolated into the shell: a
          # pull request body is arbitrary prose and will eventually contain
          # a backtick.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python .github/scripts/test_compat_gate.py
          python .github/scripts/compat_gate.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD

  rust:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  conformance:
    name: catchment · conformance (tier 1)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Mint a cross-repo token
        uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Catchment
          token: ${{ steps.app.outputs.token }}
          path: .catchment

      # TimeLakeDB is checked out for its compose topologies only — the
      # image comes from the registry below. Shallow, because nothing here
      # reads its history.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TimeLakeDB
          token: ${{ steps.app.outputs.token }}
          path: .timelakedb
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The database is a FIXTURE in this repository, not the thing under
      # test, so it arrives pre-built. Compiling DataFusion on every
      # Tributary pull request would make this gate unaffordable and it
      # would get removed, which costs more than the small staleness of
      # tracking main. Retagged to the name compose expects so the run
      # can proceed with --no-build.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the TimeLakeDB fixture image
        run: |
          img="ghcr.io/${{ github.repository_owner }}/timelakedb:main"
          docker pull "$img"
          docker tag  "$img" bench-timelakedb-timelakedb:latest
          docker image inspect "$img" --format 'fixture: {{.Id}} built {{.Created}}'

      # The agent under test, built from THIS checkout — Catchment C1's
      # tier 1 drives it as a container (stacks/tributary-agent.yml), and
      # in this repository the agent is the whole point of the gate.
      # Pre-built because compose builds a missing image during `up`,
      # which would put a cold, uncached Rust build inside the stack's
      # bring-up timeout on a two-core runner. Tagged with the name
      # compose would have chosen, so --no-build reuses it.
      - uses: docker/setup-buildx-action@v3
      - name: Build the agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bench-timelakedb-tributary:latest
          cache-from: type=gha,scope=tributary
          cache-to: type=gha,scope=tributary,mode=max

      - name: Conformance
        working-directory: .catchment
        env:
          CATCHMENT_TIMELAKE_DIR: ${{ github.workspace }}/.timelakedb
          CATCHMENT_TRIBUTARY_DIR: ${{ github.workspace }}
        run: |
          python -m catchment doctor
          python -m catchment ci --tier 1 --up --no-build

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ github.run_id }}
          path: .catchment/results/
          retention-days: 30

  publish:
    name: publish · ghcr image
    runs-on: ubuntu-latest
    # Only from the default branch, once every gate is green. Publishes the
    # agent image to GitHub Packages (ghcr) so it can be pulled and run
    # without a Rust build — the same as TimeLakeDB's own publish job. The
    # buildx cache is shared with the conformance job above (scope=tributary),
    # so this reuses those layers rather than compiling twice.
    needs: [rust, conformance]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `:main` and `:<sha>` only. `:latest` used to be pushed here too,
          # which made it "whatever main last built" — and the DaemonSet
          # manifest pinned it, so every node that rebooted pulled a
          # different agent than its neighbours (#77). `:latest` now means the
          # latest RELEASE and is written by release.yml on a tag.
          tags: |
            ghcr.io/${{ github.repository_owner }}/tributary:main
            ghcr.io/${{ github.repository_owner }}/tributary:${{ github.sha }}
          cache-from: type=gha,scope=tributary
          cache-to: type=gha,scope=tributary,mode=max
