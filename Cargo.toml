[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A log-file agent for TimeLakeDB."
repository = "https://github.com/timelakelabs/tributary"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
anyhow = "1"
regex = "1"
# L4 client certificates. `arc-swap` holds the live HTTP client so a rotated
# identity is adopted atomically without a lock on the shipping path;
# `rustls-pemfile` and `x509-parser` implement the validate-before-swap gate.
# Versions match TimeLakeDB's `timelake-tls`, which this mirrors — the two
# repositories cannot share the crate itself (nothing is published yet), so
# they share the discipline and the dependency versions instead.
arc-swap = "1"
# T-1 self-telemetry. hyper, hyper-util, http-body-util and bytes are
# already compiled into this binary by reqwest, so serving /metrics and
# /healthz costs no new crates — only a direct declaration of what is
# already there. Two routes with no extractors do not need a framework.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls-pemfile = "2"
x509-parser = "0.17"
